<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic Nexus Stargate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #00000a;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 300px;
        }
        h1 {
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 10px;
            color: #c9a3ff;
            text-shadow: 0 0 10px #c9a3ff;
        }
        p {
            font-size: 0.9em;
            line-height: 1.4;
            margin: 0;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="info-panel">
        <h1>Harmonic Nexus Stargate</h1>
        <p>An interactive visualization of cosmic energy convergence. Drag with your mouse to rotate and scroll to zoom.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // <!-- Core Scene Setup -->
        let scene, camera, renderer, controls;
        let nexus, stargates = [], particleSystem;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x00000a, 0.08);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 100;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;

            // <!-- Create Scene Objects -->
            createLights();
            createNexus();
            createStargates();
            createParticleField();
            createStarBackground();

            // <!-- Event Listeners -->
            window.addEventListener('resize', onWindowResize, false);
        }

        function createLights() {
            // Ambient light for general illumination
            const ambientLight = new THREE.AmbientLight(0x4040ff, 1);
            scene.add(ambientLight);
            
            // Central point light to make the nexus glow
            const nexusLight = new THREE.PointLight(0xffaaff, 3, 100);
            scene.add(nexusLight);

            // A cool blue directional light from above
            const dirLight = new THREE.DirectionalLight(0x00ffff, 0.5);
            dirLight.position.set(5, 10, 7.5);
            scene.add(dirLight);
        }

        // <!-- Central Harmonic Nexus -->
        function createNexus() {
            const geometry = new THREE.TorusKnotGeometry(4, 1.2, 150, 20, 2, 3);
            const material = new THREE.MeshStandardMaterial({
                color: 0xaa88ff,
                emissive: 0x8a2be2,
                emissiveIntensity: 1.5,
                metalness: 0.8,
                roughness: 0.3,
                wireframe: false
            });
            nexus = new THREE.Mesh(geometry, material);
            scene.add(nexus);
        }

        // <!-- Orbiting Stargate Geometries -->
        function createStargates() {
            const stargateCount = 8;
            for (let i = 0; i < stargateCount; i++) {
                const geometryType = Math.random();
                let geometry;
                if (geometryType < 0.33) {
                    geometry = new THREE.IcosahedronGeometry(1.2, 0);
                } else if (geometryType < 0.66) {
                    geometry = new THREE.OctahedronGeometry(1.2, 0);
                } else {
                    geometry = new THREE.TorusGeometry(1, 0.2, 8, 24);
                }
                
                const material = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6),
                    wireframe: true,
                });
                
                const stargate = new THREE.Mesh(geometry, material);

                // Position them in a circle around the nexus
                const angle = (i / stargateCount) * Math.PI * 2;
                const radius = 15;
                stargate.position.x = Math.cos(angle) * radius;
                stargate.position.y = (Math.random() - 0.5) * 8;
                stargate.position.z = Math.sin(angle) * radius;

                stargate.rotation.x = Math.random() * Math.PI;
                stargate.rotation.y = Math.random() * Math.PI;

                stargate.userData.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );

                stargates.push(stargate);
                scene.add(stargate);
            }
        }

        // <!-- Flowing Energy Particles -->
        function createParticleField() {
            const particleCount = 20000;
            const vertices = [];
            for (let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * 100;
                const y = (Math.random() - 0.5) * 100;
                const z = (Math.random() - 0.5) * 100;
                vertices.push(x, y, z);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            const material = new THREE.PointsMaterial({
                color: 0x88aaff,
                size: 0.1,
                transparent: true,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // <!-- Static Star Background -->
        function createStarBackground() {
            const starCount = 5000;
            const vertices = [];
             for (let i = 0; i < starCount; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                const dist = Math.sqrt(x*x + y*y + z*z);
                if (dist > 300) { // only add stars far away
                   vertices.push(x, y, z);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.5,
                sizeAttenuation: false,
            });
            
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }


        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // <!-- Animation Loop -->
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0005;

            // Animate Nexus
            nexus.rotation.y += 0.005;
            nexus.rotation.x += 0.002;
            
            // Animate pulsing glow on nexus
            nexus.material.emissiveIntensity = Math.sin(time * 2) * 0.5 + 1.5;

            // Animate Stargates
            stargates.forEach(stargate => {
                stargate.rotation.x += stargate.userData.rotationSpeed.x;
                stargate.rotation.y += stargate.userData.rotationSpeed.y;
                stargate.rotation.z += stargate.userData.rotationSpeed.z;
            });

            // Animate Particles
            if (particleSystem) {
                particleSystem.rotation.y += 0.0005;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
