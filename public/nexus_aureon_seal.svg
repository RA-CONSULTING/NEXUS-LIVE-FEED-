      <path d="M0,150 C40,120 40,60 0,30 C-40,60 -40,120 0,150 Z" />
      <path d="M-150,0 C-120,40 -60,40 -30,0 C-60,-40 -120,-40 -150,0 Z" />
      <path d="M150,0 C120,-40 60,-40 30,0 C60,40 120,40 150,0 Z" />
