<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aureon Institute Quantum Activation Seal</title>
  <desc id="desc">Stylised concentric seal evoking the Nexus live feed identity.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6df2ff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#6df2ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#371b7c" stop-opacity="0.15" />
    </radialGradient>
    <linearGradient id="outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9b938" />
      <stop offset="100%" stop-color="#5f2cff" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#060913" />
  <g transform="translate(256,256)">
    <circle r="200" fill="url(#core)" />
    <circle r="228" fill="none" stroke="url(#outer)" stroke-width="6" />
    <circle r="206" fill="none" stroke="#f9b938" stroke-width="1.5" stroke-dasharray="5 8" />
    <circle r="186" fill="none" stroke="#67f7ff" stroke-width="2" stroke-dasharray="12 6" opacity="0.75" />
    <g stroke="#5f2cff" stroke-width="1.4" opacity="0.75">
      <circle r="160" fill="none" />
      <circle r="118" fill="none" />
      <circle r="84" fill="none" />
    </g>
    <g stroke="#f9b938" stroke-width="1" opacity="0.6">
      <path d="M0,-186 L12,-160 L0,-134 L-12,-160 Z" fill="none" />
      <path d="M186,0 L160,12 L134,0 L160,-12 Z" fill="none" />
      <path d="M0,186 L-12,160 L0,134 L12,160 Z" fill="none" />
